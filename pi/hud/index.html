<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
<title>J.A.R.V.I.S.</title>
<style>
  :root {
    --blue: #38d0ff;
    --blue-bright: #9bf1ff;
    --blue-deep: #0a4d6e;
    --bg: #02060b;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: var(--bg); cursor: none; }
  body {
    font-family: "Eurostile", "Bank Gothic", "Agency FB", "DIN Condensed",
      ui-monospace, "SF Mono", "Roboto Mono", monospace;
    color: var(--blue);
    letter-spacing: 0.18em;
    -webkit-font-smoothing: antialiased;
  }
  #stage { position: fixed; inset: 0; }
  canvas { position: absolute; inset: 0; width: 100%; height: 100%; }

  /* Holographic scanlines + vignette over everything */
  #overlay {
    position: absolute; inset: 0; pointer-events: none;
    background:
      repeating-linear-gradient(0deg, rgba(120,230,255,0.05) 0 1px, transparent 1px 3px);
    mix-blend-mode: screen;
    animation: flicker 6s infinite steps(60);
  }
  /* Separate, gentler vignette so the centre stays bright. */
  #vignette {
    position: absolute; inset: 0; pointer-events: none;
    background: radial-gradient(130% 130% at 50% 50%, transparent 48%, rgba(0,0,0,0.72) 100%);
  }
  @keyframes flicker { 0%,100%{opacity:.85} 48%{opacity:.8} 50%{opacity:.95} 52%{opacity:.8} }

  .hud { position: absolute; pointer-events: none; text-shadow: 0 0 12px rgba(56,208,255,0.55); }

  /* Top bar */
  #topbar { top: 3.2vh; left: 0; right: 0; display: flex; justify-content: space-between;
            align-items: flex-start; padding: 0 5vw; }
  .brand { font-size: clamp(20px, 3.4vw, 46px); font-weight: 700; letter-spacing: 0.42em; }
  .brand small { display:block; font-size: clamp(8px,1vw,13px); letter-spacing:0.5em; opacity:0.65; margin-top:6px; }
  #clock { text-align: right; }
  #time { font-size: clamp(22px, 3.2vw, 44px); font-weight: 600; }
  #date { font-size: clamp(8px, 1vw, 13px); opacity: 0.7; margin-top: 4px; letter-spacing: 0.4em; }

  /* Corner telemetry readouts */
  .corner { font-size: clamp(8px, 0.95vw, 12px); line-height: 1.9; opacity: 0.62; }
  #tl { top: 16vh; left: 4vw; }
  #bl { bottom: 5vh; left: 4vw; }
  #br { bottom: 5vh; right: 4vw; text-align: right; }
  .corner .v { color: var(--blue-bright); }

  /* Center status + captions */
  #status { left: 0; right: 0; bottom: 15vh; text-align: center;
            font-size: clamp(13px, 1.7vw, 22px); letter-spacing: 0.7em; padding-left: 0.7em;
            color: var(--blue-bright); opacity: 0.92; }
  #diag { left: 0; right: 0; bottom: 12.2vh; text-align: center;
          font-size: clamp(9px, 1vw, 13px); letter-spacing: 0.3em;
          color: var(--blue-bright); opacity: 0.55; min-height: 1.2em; }
  #captions { left: 0; right: 0; bottom: 4.5vh; text-align: center; padding: 0 7vw; }
  #you { font-size: clamp(11px, 1.3vw, 17px); opacity: 0.6; min-height: 1.4em; letter-spacing: 0.25em; }
  #reply { font-size: clamp(15px, 2.1vw, 30px); margin-top: 1vh; min-height: 1.5em;
           color: var(--blue-bright); letter-spacing: 0.16em; line-height: 1.35; }
  .caret { animation: blink 1s steps(1) infinite; }
  @keyframes blink { 50% { opacity: 0; } }

  /* Boot fade-in */
  #stage { animation: boot 1.6s ease-out both; }
  @keyframes boot { from { opacity: 0; filter: brightness(2.2) blur(6px); } to { opacity: 1; filter: none; } }

  /* ---- Dashboard panels (weather / stocks / Claude chat) ---- */
  .panel {
    position: absolute; pointer-events: none; display: none;
    background: linear-gradient(180deg, rgba(12,44,64,0.42), rgba(4,18,30,0.30));
    border: 1px solid rgba(56,208,255,0.28); border-radius: 12px;
    padding: 14px 16px; backdrop-filter: blur(4px);
    box-shadow: 0 0 26px rgba(56,208,255,0.10), inset 0 0 22px rgba(56,208,255,0.06);
    text-shadow: 0 0 10px rgba(56,208,255,0.4);
  }
  .panel.show { display: block; }
  .panel h3 { font-size: clamp(8px,0.95vw,12px); letter-spacing: 0.42em;
              opacity: 0.72; margin-bottom: 10px; font-weight: 600; }

  #weather { top: 15vh; left: 3.5vw; width: min(23vw, 250px); }
  #wx-main { display: flex; align-items: center; gap: 12px; }
  #wx-icon { font-size: clamp(30px, 4vw, 52px); line-height: 1; }
  #wx-temp { font-size: clamp(28px, 4vw, 50px); font-weight: 600; color: var(--blue-bright); }
  #wx-place { font-size: clamp(10px,1.1vw,14px); margin-top: 8px; opacity: 0.85; }
  #wx-sub { font-size: clamp(9px,1vw,12px); opacity: 0.62; margin-top: 4px; letter-spacing: 0.2em; }

  #stocks { top: 15vh; right: 3.5vw; width: min(23vw, 260px); }
  .stk { display: flex; justify-content: space-between; align-items: baseline;
         font-size: clamp(10px,1.15vw,15px); padding: 5px 0;
         border-bottom: 1px solid rgba(56,208,255,0.10); }
  .stk .sym { letter-spacing: 0.2em; opacity: 0.9; }
  .stk .px { color: var(--blue-bright); }
  .stk .chg { font-size: 0.82em; margin-left: 8px; }
  .up { color: #4be08a; } .down { color: #ff6b7d; }

  #chat { bottom: 4vh; left: 3.5vw; width: min(34vw, 430px); height: 44vh;
          display: none; flex-direction: column; pointer-events: auto; cursor: auto; }
  #chat.show { display: flex; }
  #chat-log { flex: 1; overflow-y: auto; display: flex; flex-direction: column;
              gap: 8px; padding-right: 6px; }
  #chat-log::-webkit-scrollbar { width: 5px; }
  #chat-log::-webkit-scrollbar-thumb { background: rgba(56,208,255,0.3); border-radius: 3px; }
  .bubble { max-width: 88%; padding: 7px 11px; border-radius: 10px; line-height: 1.4;
            font-size: clamp(11px,1.15vw,14px); letter-spacing: 0.04em; white-space: pre-wrap; }
  .bubble.me { align-self: flex-end; background: rgba(56,208,255,0.16);
               border: 1px solid rgba(56,208,255,0.3); }
  .bubble.jarvis { align-self: flex-start; background: rgba(8,30,44,0.6);
                   border: 1px solid rgba(56,208,255,0.16); color: var(--blue-bright); }
  .bubble.think { opacity: 0.6; font-style: italic; }
  #chat-form { display: flex; gap: 8px; margin-top: 10px; }
  #chat-input { flex: 1; min-width: 0; background: rgba(2,12,20,0.7);
                border: 1px solid rgba(56,208,255,0.3); border-radius: 8px;
                color: var(--blue-bright); padding: 9px 12px; font-size: 14px;
                font-family: inherit; letter-spacing: 0.05em; }
  #chat-input:focus { outline: none; border-color: var(--blue); }
  #chat-send { background: rgba(56,208,255,0.2); border: 1px solid rgba(56,208,255,0.4);
               color: var(--blue-bright); border-radius: 8px; padding: 0 14px;
               font-family: inherit; font-size: 16px; cursor: pointer; }
</style>
</head>
<body>
  <div id="stage">
    <canvas id="c"></canvas>
    <div id="vignette"></div>
    <div id="overlay"></div>

    <div class="hud" id="topbar">
      <div class="brand">J.A.R.V.I.S.<small>JUST A RATHER VERY INTELLIGENT SYSTEM</small></div>
      <div id="clock"><div id="time">--:--</div><div id="date">— — —</div></div>
    </div>

    <div class="hud corner" id="tl">
      <div>SYS&nbsp;&nbsp;<span class="v" id="m-sys">ONLINE</span></div>
      <div>CORE&nbsp;<span class="v" id="m-core">98.6%</span></div>
      <div>LINK&nbsp;<span class="v" id="m-link">SECURE</span></div>
    </div>
    <div class="hud corner" id="bl">
      <div>PWR&nbsp;&nbsp;<span class="v" id="m-pwr">100%</span></div>
      <div>NET&nbsp;&nbsp;<span class="v">CLOUDFLARE EDGE</span></div>
    </div>
    <div class="hud corner" id="br">
      <div><span class="v" id="m-cpu">12%</span>&nbsp;&nbsp;CPU</div>
      <div><span class="v" id="m-mem">41%</span>&nbsp;&nbsp;MEM</div>
      <div id="r-disk" hidden><span class="v" id="m-disk">—</span>&nbsp;&nbsp;DISK</div>
      <div id="r-net" hidden><span class="v" id="m-net">—</span>&nbsp;&nbsp;NET</div>
      <div id="r-bat" hidden><span class="v" id="m-bat">—</span>&nbsp;&nbsp;BAT</div>
      <div><span class="v" id="m-uptime">00:00:00</span></div>
    </div>

    <div class="hud" id="status">STANDBY</div>
    <div class="hud" id="diag"></div>
    <div class="hud" id="captions">
      <div id="you"></div>
      <div id="reply"></div>
    </div>

    <!-- Dashboard panels: shown only when the local server feeds them (the
         desktop app); on the Pi HUD they stay hidden and nothing changes. -->
    <div class="panel" id="weather">
      <h3>WEATHER</h3>
      <div id="wx-main"><span id="wx-icon">•</span><span id="wx-temp">--°</span></div>
      <div id="wx-place">—</div>
      <div id="wx-sub"></div>
    </div>

    <div class="panel" id="stocks">
      <h3>MARKETS</h3>
      <div id="stk-list"></div>
    </div>

    <div class="panel" id="chat">
      <h3>J.A.R.V.I.S. — DIRECT LINE</h3>
      <div id="chat-log"></div>
      <form id="chat-form" autocomplete="off">
        <input id="chat-input" type="text" placeholder="Type to Jarvis…" />
        <button id="chat-send" type="submit" aria-label="Send">➤</button>
      </form>
    </div>
  </div>

<script>
(() => {
  const canvas = document.getElementById("c");
  const ctx = canvas.getContext("2d");
  const BLUE = "#38d0ff", BRIGHT = "#bff4ff", DEEP = "#0c5c84";

  let W = 0, H = 0, CX = 0, CY = 0, R = 0, DPR = 1;
  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 1.75);
    W = window.innerWidth; H = window.innerHeight;
    canvas.width = W * DPR; canvas.height = H * DPR;
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    CX = W / 2; CY = H / 2;
    R = Math.min(W, H) * 0.30;
  }
  window.addEventListener("resize", resize);
  resize();

  // ---- Visual state, eased toward targets so transitions feel mechanical ----
  const VIS = {
    idle:      { energy: 0.24, spin: 0.45, glow: 0.80, hue: 0 },
    listening: { energy: 0.78, spin: 0.85, glow: 1.05, hue: 0 },
    thinking:  { energy: 0.60, spin: 2.10, glow: 1.00, hue: 0 },
    speaking:  { energy: 1.00, spin: 1.20, glow: 1.10, hue: 0 },
  };
  let cur = { ...VIS.idle };
  let stateName = "idle";
  let micLevel = 0;          // 0..1 reported by the device while listening
  const STATUS_TEXT = { idle: "STANDBY", listening: "LISTENING", thinking: "PROCESSING", speaking: "SPEAKING" };

  function setState(name, level) {
    if (VIS[name]) stateName = name;
    if (typeof level === "number") micLevel = Math.max(0, Math.min(1, level));
    document.getElementById("status").textContent = STATUS_TEXT[stateName] || "";
  }

  // ---- Rotating ring helpers ----
  function ring(r, opts) {
    const { width = 1, alpha = 1, dash = null, color = BLUE, glow = 0 } = opts || {};
    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.strokeStyle = color;
    ctx.lineWidth = width;
    ctx.shadowColor = color; ctx.shadowBlur = glow;
    if (dash) ctx.setLineDash(dash);
    ctx.beginPath(); ctx.arc(CX, CY, r, 0, Math.PI * 2); ctx.stroke();
    ctx.restore();
  }
  function arc(r, a0, a1, opts) {
    const { width = 2, alpha = 1, color = BLUE, glow = 0, cap = "butt" } = opts || {};
    ctx.save();
    ctx.globalAlpha = alpha; ctx.strokeStyle = color; ctx.lineWidth = width;
    ctx.lineCap = cap; ctx.shadowColor = color; ctx.shadowBlur = glow;
    ctx.beginPath(); ctx.arc(CX, CY, r, a0, a1); ctx.stroke();
    ctx.restore();
  }
  function ticks(r, count, len, opts) {
    const { width = 1, alpha = 0.6, color = BLUE, rot = 0 } = opts || {};
    ctx.save();
    ctx.globalAlpha = alpha; ctx.strokeStyle = color; ctx.lineWidth = width;
    for (let i = 0; i < count; i++) {
      const a = rot + (i / count) * Math.PI * 2;
      const x0 = CX + Math.cos(a) * r, y0 = CY + Math.sin(a) * r;
      const x1 = CX + Math.cos(a) * (r + len), y1 = CY + Math.sin(a) * (r + len);
      ctx.beginPath(); ctx.moveTo(x0, y0); ctx.lineTo(x1, y1); ctx.stroke();
    }
    ctx.restore();
  }

  // ---- Particles for atmosphere ----
  const parts = Array.from({ length: 70 }, () => ({
    a: Math.random() * Math.PI * 2,
    r: R * (1.2 + Math.random() * 2.2),
    s: 0.0005 + Math.random() * 0.0016,
    z: 0.2 + Math.random() * 0.8,
  }));

  let t = 0, spinAcc = 0, last = performance.now();
  let bootT = 0;

  function frame(now) {
    const dt = Math.min(0.05, (now - last) / 1000); last = now; t += dt;
    bootT = Math.min(1, bootT + dt / 1.4);

    // Ease current visuals toward the target state.
    const tgt = VIS[stateName];
    const k = 1 - Math.pow(0.0001, dt); // smooth critically-damped-ish
    for (const key of ["energy", "spin", "glow", "hue"]) cur[key] += (tgt[key] - cur[key]) * k;
    spinAcc += cur.spin * dt;

    // Drive amplitude from reported mic level when listening, else synthetic.
    const breathe = 0.5 + 0.5 * Math.sin(t * 1.7);
    const amp = stateName === "listening"
      ? Math.max(cur.energy * 0.35, micLevel)
      : cur.energy * (0.55 + 0.45 * breathe);

    ctx.clearRect(0, 0, W, H);

    // Background glow behind the core.
    const bgGlow = ctx.createRadialGradient(CX, CY, 0, CX, CY, R * 2.6);
    bgGlow.addColorStop(0, `rgba(24,140,200,${0.30 * cur.glow})`);
    bgGlow.addColorStop(0.5, `rgba(16,90,140,${0.12 * cur.glow})`);
    bgGlow.addColorStop(1, "rgba(0,0,0,0)");
    ctx.fillStyle = bgGlow; ctx.fillRect(0, 0, W, H);

    const bootScale = 0.6 + 0.4 * easeOut(bootT);
    ctx.save(); ctx.translate(CX, CY); ctx.scale(bootScale, bootScale); ctx.translate(-CX, -CY);

    // Additive blending so the glows bloom and accumulate like real holography.
    ctx.globalCompositeOperation = "lighter";

    // Drifting particles.
    ctx.save();
    for (const p of parts) {
      p.a += p.s * (0.6 + cur.spin);
      const x = CX + Math.cos(p.a) * p.r, y = CY + Math.sin(p.a) * p.r;
      ctx.globalAlpha = 0.10 + 0.22 * p.z * cur.glow;
      ctx.fillStyle = BLUE;
      ctx.beginPath(); ctx.arc(x, y, p.z * 1.5, 0, Math.PI * 2); ctx.fill();
    }
    ctx.restore();

    const g = 14 * cur.glow;

    // --- Outer ring stack ---
    ring(R * 1.62, { width: 1, alpha: 0.28 * cur.glow, color: BLUE });
    ticks(R * 1.5, 120, 7, { rot: spinAcc * 0.1, alpha: 0.32 * cur.glow, width: 1 });
    ticks(R * 1.5, 12, 16, { rot: spinAcc * 0.1, alpha: 0.6 * cur.glow, width: 2, color: BRIGHT });

    // Rotating dashed mid ring.
    ctx.save(); ctx.translate(CX, CY); ctx.rotate(spinAcc * 0.5); ctx.translate(-CX, -CY);
    ring(R * 1.28, { width: 2, alpha: 0.6 * cur.glow, dash: [6, 14], color: BLUE, glow: g });
    ctx.restore();

    // Counter-rotating broken ring with bracket accents.
    ctx.save(); ctx.translate(CX, CY); ctx.rotate(-spinAcc * 0.34); ctx.translate(-CX, -CY);
    for (let i = 0; i < 4; i++) {
      const a0 = (i / 4) * Math.PI * 2 + 0.18;
      arc(R * 1.12, a0, a0 + Math.PI / 2 - 0.36, { width: 3.5, alpha: 0.98 * cur.glow, color: BLUE, glow: g, cap: "round" });
    }
    ctx.restore();

    // Fast inner accent arcs (spin up hard when thinking).
    ctx.save(); ctx.translate(CX, CY); ctx.rotate(spinAcc * 1.1); ctx.translate(-CX, -CY);
    arc(R * 0.96, 0.2, 1.5, { width: 2, alpha: 0.9 * cur.glow, color: BRIGHT, glow: g });
    arc(R * 0.96, Math.PI + 0.2, Math.PI + 1.0, { width: 2, alpha: 0.9 * cur.glow, color: BRIGHT, glow: g });
    ctx.restore();

    ring(R * 0.84, { width: 1.5, alpha: 0.5 * cur.glow, color: BLUE, glow: g });

    // --- Radial audio equalizer reacting to amplitude ---
    const bars = 100;
    ctx.save();
    ctx.strokeStyle = BRIGHT; ctx.shadowColor = BLUE; ctx.shadowBlur = g * 1.4;
    for (let i = 0; i < bars; i++) {
      const a = (i / bars) * Math.PI * 2;
      const wob = Math.sin(i * 0.6 + t * 6) * 0.5 + 0.5;
      const n = (0.22 + 0.78 * wob) * amp;
      const r0 = R * 0.52;
      const r1 = r0 + n * R * 0.34 + 3;
      ctx.globalAlpha = 0.5 + 0.5 * n;
      ctx.lineWidth = 2.4;
      ctx.beginPath();
      ctx.moveTo(CX + Math.cos(a) * r0, CY + Math.sin(a) * r0);
      ctx.lineTo(CX + Math.cos(a) * r1, CY + Math.sin(a) * r1);
      ctx.stroke();
    }
    ctx.restore();

    // --- Reactor core ---
    const pulse = 0.5 + 0.5 * Math.sin(t * (stateName === "thinking" ? 9 : 3));
    const coreR = R * (0.30 + 0.05 * amp + 0.02 * pulse);
    const core = ctx.createRadialGradient(CX, CY, 0, CX, CY, coreR);
    core.addColorStop(0, "rgba(216,250,255,1)");
    core.addColorStop(0.22, `rgba(150,238,255,${cur.glow})`);
    core.addColorStop(0.5, `rgba(90,215,255,${0.9 * cur.glow})`);
    core.addColorStop(0.8, `rgba(24,135,200,${0.5 * cur.glow})`);
    core.addColorStop(1, "rgba(8,50,85,0)");
    ctx.save();
    ctx.shadowColor = BLUE; ctx.shadowBlur = 75 * cur.glow;
    ctx.fillStyle = core;
    ctx.beginPath(); ctx.arc(CX, CY, coreR, 0, Math.PI * 2); ctx.fill();
    ctx.restore();

    // Core rotating triangle reticle (arc-reactor motif).
    ctx.save();
    ctx.translate(CX, CY); ctx.rotate(spinAcc * 0.7);
    ctx.globalAlpha = 0.8 * cur.glow; ctx.strokeStyle = BRIGHT; ctx.lineWidth = 1.5;
    ctx.shadowColor = BLUE; ctx.shadowBlur = g;
    ctx.beginPath();
    for (let i = 0; i < 3; i++) {
      const a = (i / 3) * Math.PI * 2 - Math.PI / 2;
      const x = Math.cos(a) * coreR * 0.7, y = Math.sin(a) * coreR * 0.7;
      i ? ctx.lineTo(x, y) : ctx.moveTo(x, y);
    }
    ctx.closePath(); ctx.stroke();
    ctx.restore();

    ctx.restore(); // boot scale

    requestAnimationFrame(frame);
  }
  function easeOut(x) { return 1 - Math.pow(1 - x, 3); }
  requestAnimationFrame(frame);

  // ---- Clock + telemetry ----
  // Real machine stats when the device serves /stats; the stylised numbers
  // below are only a stand-in for a display with no host to ask.
  const startTime = Date.now();
  let statsLive = false;
  function pad(n) { return String(n).padStart(2, "0"); }
  function hms(secs) {
    const s = Math.max(0, Math.floor(secs));
    const d = Math.floor(s / 86400);
    const t = `${pad(Math.floor(s/3600) % 24)}:${pad(Math.floor(s/60)%60)}:${pad(s%60)}`;
    return d ? `${d}d ${t}` : t;
  }
  setInterval(() => {
    const d = new Date();
    document.getElementById("time").textContent = `${pad(d.getHours())}:${pad(d.getMinutes())}`;
    document.getElementById("date").textContent =
      d.toLocaleDateString("en-US", { weekday: "short", month: "short", day: "numeric" }).toUpperCase();
    if (statsLive) return;  // real numbers own these readouts
    document.getElementById("m-uptime").textContent = hms((Date.now() - startTime) / 1000);
    document.getElementById("m-cpu").textContent = `${8 + Math.floor(Math.random()*10)}%`;
    document.getElementById("m-mem").textContent = `${38 + Math.floor(Math.random()*8)}%`;
    document.getElementById("m-core").textContent = `${(98 + Math.random()).toFixed(1)}%`;
  }, 1000);

  let statsInFlight = false, statsMisses = 0;
  async function refreshStats() {
    if (statsInFlight) return;       // never let slow probes pile up
    statsInFlight = true;
    let s;
    try {
      const ctl = new AbortController();
      const bail = setTimeout(() => ctl.abort(), 4000);
      try {
        const r = await fetch("/stats", { cache: "no-store", signal: ctl.signal });
        if (!r.ok) throw 0;
        s = await r.json();
      } finally { clearTimeout(bail); }
    } catch (e) {
      // Telemetry stopped answering. Hand the readouts back to the stand-in
      // rather than leaving stale numbers frozen on screen forever.
      if (statsLive && ++statsMisses >= 3) { statsLive = false; statsMisses = 0; }
      return;
    } finally { statsInFlight = false; }
    if (!s || s.available === false) return;
    statsMisses = 0;
    // Only take over the readouts once there is something real to show.
    if (typeof s.cpu !== "number" && typeof s.mem !== "number") return;
    statsLive = true;
    const set = (id, text) => { document.getElementById(id).textContent = text; };
    if (typeof s.cpu === "number") set("m-cpu", `${Math.round(s.cpu)}%`);
    // CORE: the silicon's own temperature where the platform exposes it
    // (a Pi always does), otherwise the finer-grained CPU load.
    if (typeof s.temp_c === "number") set("m-core", `${s.temp_c.toFixed(1)}°C`);
    else if (typeof s.cpu === "number") set("m-core", `${s.cpu.toFixed(1)}%`);
    // Detail goes inline, not in a title tooltip: the HUD hides the cursor,
    // so a hover-only readout would never be seen.
    if (typeof s.mem === "number") {
      set("m-mem", s.mem_total_gb != null
        ? `${Math.round(s.mem)}% · ${s.mem_used_gb}/${s.mem_total_gb}G`
        : `${Math.round(s.mem)}%`);
    }
    if (typeof s.disk === "number") {
      set("m-disk", s.disk_free_gb != null
        ? `${Math.round(s.disk)}% · ${s.disk_free_gb}G free`
        : `${Math.round(s.disk)}%`);
      document.getElementById("r-disk").hidden = false;
    }
    if (typeof s.net_down === "number") {
      const rate = (kb) => kb >= 1024 ? `${(kb/1024).toFixed(1)}M` : `${Math.round(kb)}K`;
      set("m-net", `↓${rate(s.net_down)} ↑${rate(s.net_up || 0)}`);
      document.getElementById("r-net").hidden = false;
    }
    if (typeof s.uptime === "number") set("m-uptime", hms(s.uptime));
    // Battery belongs in this corner: the dashboard panels cover the others.
    if (s.battery && typeof s.battery.percent === "number") {
      const mark = s.battery.plugged === true ? " ⚡"
                 : s.battery.plugged === false ? "" : " ?";
      set("m-bat", `${s.battery.percent}%${mark}`);
      set("m-pwr", `${s.battery.percent}%${mark}`);
      document.getElementById("r-bat").hidden = false;
    } else if (s.battery === null) {
      set("m-pwr", "AC");            // no battery: nothing worth a row here
    }
  }
  refreshStats(); setInterval(refreshStats, 2000);

  // ---- Caption typewriter ----
  let typing = null;
  function typeReply(text) {
    const el = document.getElementById("reply");
    clearInterval(typing); el.textContent = ""; if (!text) return;
    let i = 0;
    typing = setInterval(() => {
      el.textContent = text.slice(0, ++i);
      const c = document.createElement("span"); c.className = "caret"; c.textContent = "▌";
      el.appendChild(c);
      if (i >= text.length) clearInterval(typing);
    }, 22);
  }

  // ---- State source: poll the device; show NO LINK when it's unreachable ----
  let lastReply = "", lastYou = "", offline = false, pollFails = 0;
  async function poll() {
    try {
      const r = await fetch("/state", { cache: "no-store" });
      if (!r.ok) throw 0;
      const s = await r.json();
      pollFails = 0;
      offline = false;
      setState(s.state || "idle", s.level);
      // Wake diagnostics, when the device reports them: proof of what the
      // mic hears (MIC) and how close "Hey Jarvis" came to firing (WAKE).
      document.getElementById("diag").textContent =
        (typeof s.miclevel === "number" && (s.state || "idle") === "idle")
          ? `MIC ${Math.round(s.miclevel * 100)}%  ·  WAKE ${(s.wake ?? 0).toFixed(2)}`
          : "";
      if ((s.you || "") !== lastYou) {
        lastYou = s.you || "";
        document.getElementById("you").textContent = lastYou ? `“${lastYou}”` : "";
        if (lastYou) addBubble("me", lastYou);   // voice turns join the Direct Line
      }
      if ((s.reply || "") !== lastReply) {
        lastReply = s.reply || "";
        typeReply(lastReply);
        if (lastReply) addBubble("jarvis", lastReply);
      }
    } catch (e) {
      // No fake conversations here: if the app is unreachable, say so. A few
      // consecutive misses are tolerated so a transient hiccup (busy server,
      // reload) doesn't flicker the banner.
      if (!offline && ++pollFails >= 5) {
        offline = true;
        setState("idle");
        document.getElementById("status").textContent = "NO LINK";
        document.getElementById("diag").textContent = "WAITING FOR THE JARVIS APP — IS IT RUNNING?";
        lastYou = ""; document.getElementById("you").textContent = "";
        lastReply = ""; typeReply("");
      }
    }
  }
  setInterval(poll, 150);

  // ---- Dashboard: weather + markets + a Claude chat line ----
  // Each panel only appears once its local endpoint answers, so the Pi HUD
  // (which serves neither) is unchanged.

  async function refreshWeather() {
    try {
      const w = await (await fetch("/weather", { cache: "no-store" })).json();
      if (w.configured === false || w.error || w.temp === undefined) {
        if (w.configured === false) {
          document.getElementById("weather").classList.add("show");
          document.getElementById("wx-place").textContent = "Set JARVIS_WEATHER_LOCATION";
          document.getElementById("wx-temp").textContent = "";
          document.getElementById("wx-icon").textContent = "⚙";
        }
        return;
      }
      document.getElementById("wx-icon").textContent = w.icon;
      document.getElementById("wx-temp").textContent = `${w.temp}°`;
      document.getElementById("wx-place").textContent = w.place;
      document.getElementById("wx-sub").textContent = `${w.phrase} · H ${w.hi}°  L ${w.lo}°`;
      document.getElementById("weather").classList.add("show");
      document.getElementById("tl").style.display = "none";  // panel takes this corner
    } catch (e) { /* endpoint absent (Pi) → stay hidden */ }
  }

  async function refreshStocks() {
    try {
      const d = await (await fetch("/stocks", { cache: "no-store" })).json();
      if (!d.quotes || !d.quotes.length) return;
      document.getElementById("stk-list").innerHTML = d.quotes.map((q) => {
        const cls = q.change >= 0 ? "up" : "down";
        const sign = q.change >= 0 ? "+" : "";
        return `<div class="stk"><span class="sym">${q.symbol}</span>` +
          `<span><span class="px">${q.price.toLocaleString()}</span>` +
          `<span class="chg ${cls}">${sign}${q.change}%</span></span></div>`;
      }).join("");
      document.getElementById("stocks").classList.add("show");
    } catch (e) { /* endpoint absent (Pi) → stay hidden */ }
  }

  const chatLog = document.getElementById("chat-log");
  function addBubble(who, text, cls) {
    const b = document.createElement("div");
    b.className = `bubble ${who}${cls ? " " + cls : ""}`;
    b.textContent = text;
    chatLog.appendChild(b);
    chatLog.scrollTop = chatLog.scrollHeight;
    return b;
  }

  async function initChat() {
    // Only enable the chat line if the app exposes /chat (the desktop app).
    try {
      const probe = await fetch("/chat", { method: "POST", headers: { "content-type": "application/json" }, body: "{}" });
      if (!probe.ok) return;
    } catch (e) { return; }
    document.getElementById("chat").classList.add("show");
    document.getElementById("bl").style.display = "none";  // panel takes this corner
    const form = document.getElementById("chat-form");
    const input = document.getElementById("chat-input");
    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const text = input.value.trim();
      if (!text) return;
      input.value = "";
      addBubble("me", text);
      const thinking = addBubble("jarvis", "thinking…", "think");
      try {
        const r = await fetch("/chat", {
          method: "POST", headers: { "content-type": "application/json" },
          body: JSON.stringify({ text }),
        });
        const data = await r.json();
        thinking.remove();
        addBubble("jarvis", data.reply || "…");
      } catch (err) {
        thinking.remove();
        addBubble("jarvis", "I couldn't reach my brain just now.");
      }
    });
  }

  refreshWeather(); setInterval(refreshWeather, 600000);
  refreshStocks(); setInterval(refreshStocks, 60000);
  initChat();
})();
</script>
</body>
</html>
